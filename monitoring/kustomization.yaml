# About: the Grafana observability stack - metrics (kube-prometheus-stack with
# Grafana), logs (Loki), traces (Tempo) and the Alloy collector feeding them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - kube-prometheus-stack.yaml
  - loki.yaml
  - tempo.yaml
  - alloy.yaml
