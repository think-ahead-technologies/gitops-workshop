# About: Tempo trace store in single-binary mode. Receives OTLP traces from
# Alloy and serves them to Grafana on port 3200.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: tempo
      version: 3.2.1
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  values:
    tempo:
      retention: 72h
