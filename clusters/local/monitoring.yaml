# About: Flux Kustomization for the Grafana observability stack.
# Waits for the Helm repositories, then reports Ready only when all
# HelmReleases in ./monitoring are healthy.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-sources
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./monitoring
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
