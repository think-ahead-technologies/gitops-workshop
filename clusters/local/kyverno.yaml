# About: Flux Kustomization for the Kyverno policy layer. Waits for the Helm
# repositories and reports Ready only when Kyverno and its policies are healthy.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-sources
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./infrastructure/kyverno
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
